<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Авторизация и Калькулятор суммы</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 25px;
            padding: 20px;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 380px;
            text-align: center;
            transition: transform 0.2s ease;
        }

        .card:hover {
            transform: translateY(-3px);
        }

        h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 22px;
        }

        .field {
            margin-bottom: 15px;
            text-align: left;
        }

        .field label {
            display: block;
            margin-bottom: 6px;
            font-size: 13px;
            font-weight: 600;
            color: #555;
        }

        .field input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s;
        }

        .field input:focus {
            border-color: #667eea;
        }

        .btn {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
            transition: opacity 0.2s, transform 0.1s;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn:hover {
            opacity: 0.95;
        }

        
        #msg {
            margin-top: 15px;
            padding: 10px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
            display: none;
        }

        #msg.success {
            display: block;
            background-color: #e6f4ea;
            color: green;
        }

        #msg.error {
            display: block;
            background-color: #fce8e6;
            color: red;
        }

   
        .result-box {
            margin-top: 15px;
            font-size: 18px;
            font-weight: bold;
            color: #333;
            background: #f8f9fa;
            padding: 10px;
            border-radius: 8px;
            border: 1px dashed #667eea;
        }

        .hint {
            font-size: 12px;
            color: #777;
            margin-top: 4px;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>🔒 Вход в систему</h2>
        
        <div class="field">
            <label>Логин</label>
            <input type="text" id="loginIn" placeholder="admin, user1, alex...">
        </div>

        <div class="field">
            <label>Пароль</label>
            <input type="password" id="passIn" placeholder="••••••••">
        </div>

        <button class="btn" onclick="login()">Войти</button>

        <div id="msg"></div>
    </div>

    <div class="card">
        <h2>🧮 Функция sumAll()</h2>
        
        <div class="field">
            <label>Введите числа через запятую:</label>
            <input type="text" id="numsIn" placeholder="2, 5, 6, 7" oninput="calcSum()">
            <div class="hint">Считает сумму любого количества чисел</div>
        </div>

        <div class="result-box">
            Сумма: <span id="sumResult">0</span>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
